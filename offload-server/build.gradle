plugins {
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':offload-api')

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'org.curtinfrc.frc2026.util.Repulsor.Offload.Server.OffloadServerMain'
}

test {
    useJUnitPlatform()
}

def offloadApiJar = project(':offload-api').tasks.named('jar')

tasks.named('jar', Jar) {
    dependsOn(offloadApiJar)

    manifest {
        attributes(
            'Main-Class': 'org.curtinfrc.frc2026.util.Repulsor.Offload.Server.OffloadServerMain'
        )
    }

    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    from {
        configurations.runtimeClasspath.collect { file ->
            file.isDirectory() ? file : zipTree(file)
        }
    }
}