name: Repulsor 3D Sim C++

on:
  push:
    paths:
      - "repulsor_3d_sim_cpp/**"
      - ".github/workflows/repulsor-3d-sim-cpp.yml"
  pull_request:
    paths:
      - "repulsor_3d_sim_cpp/**"
      - ".github/workflows/repulsor-3d-sim-cpp.yml"

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S repulsor_3d_sim_cpp -B repulsor_3d_sim_cpp/build-ci
          -DREPULSOR_SIM_FETCH_DEPS=ON
          -DREPULSOR_SIM_USE_NTCORE=OFF
          -DREPULSOR_SIM_BUILD_TESTS=ON

      - name: Build
        run: cmake --build repulsor_3d_sim_cpp/build-ci --config Release

      - name: Test + Perf Gate
        env:
          REPULSOR_BENCH_MAX_CULL_MS: "35.0"
          REPULSOR_BENCH_MAX_COMMAND_MS: "12.0"
        run: ctest --test-dir repulsor_3d_sim_cpp/build-ci -C Release --output-on-failure
